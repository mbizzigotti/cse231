<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fer-de-Lance Program Generator</title>
  <style>
    body {
      font-family: monospace;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1 { color: #569cd6; font-size: 1.4em; }
    .label { color: #6a9955; margin-bottom: 8px; font-size: 0.85em; }
    #prog {
      background: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 20px;
      white-space: pre-wrap;
      font-size: 0.95em;
      line-height: 1.6;
      min-height: 100px;
      color: #ce9178;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 22px;
      font-family: monospace;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1177bb; }
    #dl-btn { background: #6b3fa0; }
    #dl-btn:hover { background: #8250c8; }
    .input-wrap { display: flex; align-items: center; gap: 8px; }
    .input-wrap label { color: #9cdcfe; font-size: 0.9em; }
    .input-wrap input {
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 0.95em;
      padding: 6px 10px;
      width: 80px;
    }
    #result-section { margin-top: 20px; }
    #result-box {
      background: #1a1a2e;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 16px 20px;
      white-space: pre-wrap;
      font-size: 0.95em;
      line-height: 1.6;
      min-height: 40px;
    }
    .ok  { color: #4ec94e; }
    .err { color: #f44747; }
    .printed { color: #dcdcaa; }
  </style>
</head>
<body>
  <a href="../index.html" style="color:#569cd6;font-size:0.85em">← home</a>
  <h1>Fer-de-Lance Program Generator</h1>
  <a href="batch.html" style="color:#569cd6;font-size:0.85em">→ batch test generator</a>
  <div class="controls">
    <button onclick="generate()">Generate</button>
    <button id="dl-btn" onclick="downloadTest()">Download test</button>
    <div class="input-wrap">
      <label>complexity =</label>
      <input id="complexity-val" type="range" min="0" max="4" value="1"
        oninput="document.getElementById('complexity-display').textContent=this.value"
        style="width:120px;accent-color:#0e639c">
      <span id="complexity-display">1</span>
    </div>
  </div>
  <p></p>
  <div class="label">; randomly generated fer-de-lance program</div>
  <div id="prog"></div>

  <div id="result-section" style="display:none">
    <div class="label" style="margin-top:20px">; output</div>
    <div id="result-box"></div>
  </div>

  <script src="generator.js"></script>
  <script>
    let currentProg = null; // { source, input, printed, result }

    function generate() {
      const c = parseInt(document.getElementById('complexity-val').value, 10) || 0;
      currentProg = genProgram(c);
      document.getElementById('prog').textContent = currentProg.source;
      run();
    }

    function run() {
      if (!currentProg) return;
      const section = document.getElementById('result-section');
      section.style.display = 'block';
      const box = document.getElementById('result-box');
      let html = '';
      for (const line of currentProg.printed) {
        html += `<span class="printed">${escHtml(line)}</span>\n`;
      }
      html += `<span class="ok">=> ${escHtml(currentProg.result)}</span>`;
      box.innerHTML = html;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function downloadTest() {
      if (!currentProg) return;
      const { source, input, printed, result } = currentProg;

      const fullOutput = [...printed, result].join('\n').replace(/\n+$/, '');
      const rustExpected = fullOutput
        .replace(/\\/g, '\\\\')
        .replace(/"/g,  '\\"')
        .replace(/\n/g, '\\n');

      const name  = 'gen_' + Date.now();
      const delim = 'SNEK_' + Math.random().toString(36).slice(2, 8).toUpperCase();
      const script = buildScript(name, source, input, rustExpected, delim);

      const blob = new Blob([script], { type: 'text/x-shellscript' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name + '.sh';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function buildScript(name, source, input, rustExpected, delim) {
      const lines = [];
      lines.push('#!/bin/bash');
      lines.push(`# Auto-generated Fer-de-Lance test: ${name}`);
      lines.push('set -e', '');
      lines.push('SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"');
      lines.push(`SNEK_FILE="$SCRIPT_DIR/tests/${name}.snek"`);
      lines.push('ALL_TESTS="$SCRIPT_DIR/tests/all_tests.rs"', '');

      lines.push(`cat > "$SNEK_FILE" << '${delim}'`);
      lines.push(source);
      lines.push(delim, '');
      lines.push('echo "Wrote $SNEK_FILE"', '');

      lines.push('python3 - "$ALL_TESTS" << \'PYEOF\'');
      lines.push('import sys');
      lines.push('');
      lines.push('path = sys.argv[1]');
      lines.push('with open(path) as f:');
      lines.push('    content = f.read()');
      lines.push('');
      lines.push('entry = """    {');
      lines.push(`        name: ${name},`);
      lines.push(`        file: "${name}.snek",`);
      lines.push(`        input: "${input}",`);
      lines.push(`        expected: "${rustExpected}",`);
      lines.push('    },"""');
      lines.push('');
      lines.push("marker = '}\\n\\nruntime_error_tests'");
      lines.push('idx = content.find(marker)');
      lines.push('if idx == -1:');
      lines.push('    print("Error: could not find insertion point in all_tests.rs", file=sys.stderr)');
      lines.push('    sys.exit(1)');
      lines.push('');
      lines.push("content = content[:idx] + entry + '\\n' + content[idx:]");
      lines.push('with open(path, \'w\') as f:');
      lines.push('    f.write(content)');
      lines.push('');
      lines.push(`print("Added test '${name}' to", path)`);
      lines.push('PYEOF', '');
      lines.push(`echo "Done! Run: cargo test ${name}"`);

      return lines.join('\n') + '\n';
    }

    generate();
  </script>
</body>
</html>
