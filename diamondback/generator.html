<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diamondback Program Generator</title>
  <style>
    body {
      font-family: monospace;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1 { color: #569cd6; font-size: 1.4em; }
    .label { color: #6a9955; margin-bottom: 8px; font-size: 0.85em; }
    #prog {
      background: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 20px;
      white-space: pre-wrap;
      font-size: 0.95em;
      line-height: 1.6;
      min-height: 100px;
      color: #ce9178;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 22px;
      font-family: monospace;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1177bb; }
    #dl-btn { background: #6b3fa0; }
    #dl-btn:hover { background: #8250c8; }
    .input-wrap { display: flex; align-items: center; gap: 8px; }
    .input-wrap label { color: #9cdcfe; font-size: 0.9em; }
    .input-wrap input {
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 0.95em;
      padding: 6px 10px;
      width: 80px;
    }
    #result-section { margin-top: 20px; }
    #result-box {
      background: #1a1a2e;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 16px 20px;
      white-space: pre-wrap;
      font-size: 0.95em;
      line-height: 1.6;
      min-height: 40px;
    }
    .ok  { color: #4ec94e; }
    .err { color: #f44747; }
    .printed { color: #dcdcaa; }
  </style>
</head>
<body>
  <h1>Diamondback Program Generator</h1>
  <a href="batch.html" style="color:#569cd6;font-size:0.85em">→ batch test generator</a>
  <div class="controls">
    <button onclick="generate()">Generate</button>
    <button id="dl-btn" onclick="downloadTest()">Download test</button>
    <div class="input-wrap">
      <label>input =</label>
      <input id="input-val" type="number" value="0" oninput="run()">
    </div>
    <div class="input-wrap">
      <label>size =</label>
      <input id="size-val" type="range" min="5" max="100" value="20"
      oninput="document.getElementById('size-display').textContent=this.value"
      style="width:120px;accent-color:#0e639c">
      <span id="size-display">20</span>
    </div>
  </div>
  <p></p>
  <div class="label">; randomly generated diamondback program</div>
  <div id="prog"></div>

  <div id="result-section" style="display:none">
    <div class="label" style="margin-top:20px">; output</div>
    <div id="result-box"></div>
  </div>

  <script src="generator.js"></script>
  <script>
    let currentProgText = '';

    function generate() {
      const size = parseInt(document.getElementById('size-val').value, 10);
      const { prog, input } = generateOne(size);
      currentProgText = prog;
      document.getElementById('input-val').value = input;
      document.getElementById('prog').textContent = prog;
      run();
    }

    let runSeq = 0;
    async function run() {
      const seq = ++runSeq;
      const inputVal = document.getElementById('input-val').value || '0';
      const box = document.getElementById('result-box');
      document.getElementById('result-section').style.display = 'block';
      box.innerHTML = '<span style="color:#888">running…</span>';

      try {
        const { printed, result } = await runWithTimeout(currentProgText, inputVal);
        if (seq !== runSeq) return;
        let html = '';
        for (const line of printed)
          html += `<span class="printed">${escHtml(line)}</span>\n`;
        html += `<span class="ok">${escHtml(result)}</span>`;
        box.innerHTML = html;
      } catch(e) {
        if (seq !== runSeq) return;
        box.innerHTML = `<span class="err">error: ${escHtml(e.message ?? e)}</span>`;
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function downloadTest() {
      const inputVal = document.getElementById('input-val').value || '0';
      const dlBtn = document.getElementById('dl-btn');
      dlBtn.disabled = true;

      let printed, result;
      try {
        ({ printed, result } = await runWithTimeout(currentProgText, inputVal));
      } catch (e) {
        alert('Program errored — regenerate or fix before downloading:\n' + (e.message ?? e));
        dlBtn.disabled = false;
        return;
      } finally {
        dlBtn.disabled = false;
      }

      const section = document.getElementById('result-section');
      section.style.display = 'block';
      const box = document.getElementById('result-box');
      let html = '';
      for (const line of printed) html += `<span class="printed">${escHtml(line)}</span>\n`;
      html += `<span class="ok">=> ${escHtml(result)}</span>`;
      box.innerHTML = html;

      const fullOutput = [...printed, result].join('\n').replace(/\n+$/, '');
      const rustExpected = fullOutput
        .replace(/\\/g, '\\\\')
        .replace(/"/g,  '\\"')
        .replace(/\n/g, '\\n');

      const name  = 'gen_' + Date.now();
      const delim = 'SNEK_' + Math.random().toString(36).slice(2, 8).toUpperCase();
      const script = buildScript(name, inputVal, rustExpected, delim);

      const blob = new Blob([script], { type: 'text/x-shellscript' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name + '.sh';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function buildScript(name, input, rustExpected, delim) {
      const lines = [];
      lines.push('#!/bin/bash');
      lines.push(`# Auto-generated Diamondback test: ${name}`);
      lines.push('set -e', '');
      lines.push('SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"');
      lines.push(`SNEK_FILE="$SCRIPT_DIR/tests/${name}.snek"`);
      lines.push('ALL_TESTS="$SCRIPT_DIR/tests/all_tests.rs"', '');

      lines.push(`cat > "$SNEK_FILE" << '${delim}'`);
      lines.push(currentProgText);
      lines.push(delim, '');
      lines.push('echo "Wrote $SNEK_FILE"', '');

      lines.push('python3 - "$ALL_TESTS" << \'PYEOF\'');
      lines.push('import sys');
      lines.push('');
      lines.push('path = sys.argv[1]');
      lines.push('with open(path) as f:');
      lines.push('    content = f.read()');
      lines.push('');
      lines.push('entry = """    {');
      lines.push(`        name: ${name},`);
      lines.push(`        file: "${name}.snek",`);
      lines.push(`        input: "${input}",`);
      lines.push(`        expected: "${rustExpected}",`);
      lines.push('    },"""');
      lines.push('');
      lines.push("marker = '}\\n\\nruntime_error_tests'");
      lines.push('idx = content.find(marker)');
      lines.push('if idx == -1:');
      lines.push('    print("Error: could not find insertion point in all_tests.rs", file=sys.stderr)');
      lines.push('    sys.exit(1)');
      lines.push('');
      lines.push("content = content[:idx] + entry + '\\n' + content[idx:]");
      lines.push('with open(path, \'w\') as f:');
      lines.push('    f.write(content)');
      lines.push('');
      lines.push(`print("Added test '${name}' to", path)`);
      lines.push('PYEOF', '');
      lines.push(`echo "Done! Run: cargo test ${name}"`);

      return lines.join('\n') + '\n';
    }

    generate();
  </script>
</body>
</html>
