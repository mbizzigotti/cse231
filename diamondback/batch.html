<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diamondback Batch Test Generator</title>
  <style>
    body {
      font-family: monospace;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1 { color: #569cd6; font-size: 1.4em; }
    a  { color: #569cd6; font-size: 0.85em; }
    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .field { display: flex; align-items: center; gap: 8px; }
    .field label { color: #9cdcfe; }
    .field input[type=number] {
      background: #3c3c3c;
      border: 1px solid #555;
      border-radius: 4px;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 0.95em;
      padding: 6px 10px;
      width: 70px;
    }
    .field input[type=range] { width: 120px; accent-color: #0e639c; }
    button {
      background: #6b3fa0;
      color: white;
      border: none;
      padding: 10px 24px;
      font-family: monospace;
      font-size: 1em;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #8250c8; }
    button:disabled { background: #444; cursor: default; }
    #status {
      margin-top: 20px;
      font-size: 0.9em;
      min-height: 1.4em;
    }
    .ok  { color: #4ec94e; }
    .err { color: #f44747; }
    .dim { color: #888; }
  </style>
</head>
<body>
  <h1>Diamondback Batch Test Generator</h1>
  <a href="generator.html">← single program generator</a>

  <div class="row">
    <div class="field">
      <label>tests =</label>
      <input id="count-val" type="number" value="10" min="1" max="500">
    </div>
    <div class="field">
      <label>size =</label>
      <input id="size-val" type="range" min="5" max="100" value="20"
             oninput="document.getElementById('size-display').textContent=this.value">
      <span id="size-display">20</span>
    </div>
  </div>

  <button id="dl-btn" onclick="generateBatch()">Generate &amp; Download</button>
  <div id="status" class="dim">Ready.</div>

  <script src="reference.js"></script>
  <script>
    // ─── Generator (shared with generator.html) ───────────────────────────────

    const T_INT = 'int', T_BOOL = 'bool', T_ANY = 'any';

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function rand(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }

    let varCounter = 0, funCounter = 0, budget = 0;
    function freshVar() { return `v${++varCounter}`; }
    function freshFun() { return `f${++funCounter}`; }

    function genExpr(env, want, allowInput, funs) {
      if (budget <= 0) return genLeaf(env, want, allowInput);
      budget--;

      const forms = ['let', 'if', 'block', 'loop'];
      const setTargets = [...env.entries()].filter(([, t]) => want === T_ANY || t === want);
      if (setTargets.length > 0) forms.push('set!');

      if (want === T_INT || want === T_ANY)
        forms.push('add1', 'sub1', 'print_int', '+', '-', '*');
      if (want === T_BOOL || want === T_ANY)
        forms.push('isnum', 'isbool', 'print_bool', '<', '>', '>=', '<=', 'eq');
      for (const [name, fn] of funs)
        if (want === T_ANY || fn.retType === want) forms.push(`call:${name}`);

      const choice = pick(forms);
      switch (choice) {
        case 'let': {
          const n = rand(1, 3);
          const parts = [], newEnv = new Map(env);
          for (let i = 0; i < n; i++) {
            const vt = pick([T_INT, T_BOOL]), vn = freshVar();
            parts.push(`(${vn} ${genExpr(newEnv, vt, allowInput, funs)})`);
            newEnv.set(vn, vt);
          }
          return `(let (${parts.join(' ')}) ${genExpr(newEnv, want, allowInput, funs)})`;
        }
        case 'if':
          return `(if ${genExpr(env, T_BOOL, allowInput, funs)} ` +
                     `${genExpr(env, want, allowInput, funs)} ` +
                     `${genExpr(env, want, allowInput, funs)})`;
        case 'block': {
          const exprs = Array.from({length: rand(1, 3)}, () => genExpr(env, T_ANY, allowInput, funs));
          exprs.push(genExpr(env, want, allowInput, funs));
          return `(block ${exprs.join(' ')})`;
        }
        case 'loop': {
          const counter = freshVar(), limit = rand(1, 6);
          const newEnv = new Map([...env, [counter, T_INT]]);
          const breakVal = genExpr(newEnv, want, allowInput, funs);
          return `(let ((${counter} 0)) (loop (if (>= ${counter} ${limit}) ` +
                 `(break ${breakVal}) (set! ${counter} (add1 ${counter})))))`;
        }
        case 'set!': {
          const [varName, varType] = pick(setTargets);
          return `(set! ${varName} ${genExpr(env, varType, allowInput, funs)})`;
        }
        case 'add1':       return `(add1 ${genExpr(env, T_INT, allowInput, funs)})`;
        case 'sub1':       return `(sub1 ${genExpr(env, T_INT, allowInput, funs)})`;
        case 'print_int':  return `(print ${genExpr(env, T_INT, allowInput, funs)})`;
        case 'print_bool': return `(print ${genExpr(env, T_BOOL, allowInput, funs)})`;
        case 'isnum':      return `(isnum ${genExpr(env, T_ANY, allowInput, funs)})`;
        case 'isbool':     return `(isbool ${genExpr(env, T_ANY, allowInput, funs)})`;
        case '+': case '-': case '*':
          return `(${choice} ${genExpr(env, T_INT, allowInput, funs)} ${genExpr(env, T_INT, allowInput, funs)})`;
        case '<': case '>': case '>=': case '<=':
          return `(${choice} ${genExpr(env, T_INT, allowInput, funs)} ${genExpr(env, T_INT, allowInput, funs)})`;
        case 'eq': {
          const at = pick([T_INT, T_BOOL]);
          return `(= ${genExpr(env, at, allowInput, funs)} ${genExpr(env, at, allowInput, funs)})`;
        }
        default: {
          const name = choice.slice(5), fn = funs.get(name);
          const args = fn.params.map(p => genExpr(env, p.type, allowInput, funs));
          return args.length ? `(${name} ${args.join(' ')})` : `(${name})`;
        }
      }
    }

    function genLeaf(env, want, allowInput) {
      const opts = [];
      if (want === T_INT || want === T_ANY) {
        opts.push(() => String(rand(0, 100)));
        if (allowInput) opts.push(() => 'input');
      }
      if (want === T_BOOL || want === T_ANY) opts.push(() => pick(['true', 'false']));
      for (const [name, type] of env)
        if (want === T_ANY || type === want) opts.push(() => name);
      return pick(opts)();
    }

    // Generates one complete program text and returns it along with a random input.
    function generateOne(size) {
      varCounter = 0;
      funCounter = 0;
      budget = size;

      const sigs = Array.from({length: rand(0, 3)}, () => ({
        name: freshFun(),
        params: Array.from({length: rand(0, 3)}, (_, i) => ({
          name: `p${i + 1}`, type: pick([T_INT, T_BOOL]),
        })),
        retType: pick([T_INT, T_BOOL]),
      }));
      const funs = new Map(sigs.map(s => [s.name, { params: s.params, retType: s.retType }]));

      const defns = sigs.map(sig => {
        const env = new Map(sig.params.map(p => [p.name, p.type]));
        const funsWithoutSelf = new Map([...funs].filter(([n]) => n !== sig.name));
        const body = genExpr(env, sig.retType, false, funsWithoutSelf);
        return { ...sig, body };
      });

      const lines = defns.map(({ name, params, body }) => {
        const ps = params.map(p => p.name).join(' ');
        return `(fun (${name}${ps ? ' ' + ps : ''}) ${body})`;
      });
      lines.push(genExpr(new Map(), T_ANY, true, funs));

      return { prog: lines.join('\n'), input: String(rand(-100, 100)) };
    }

    // Runs a program and returns the expected output string (no trailing newline).
    function runProg(prog, input) {
      const printed = [];
      const origLog = console.log;
      console.log = (...args) => printed.push(args.join(' '));
      try {
        const result = interpreter.run(prog, input);
        return [...printed, result].join('\n').replace(/\n+$/, '');
      } finally {
        console.log = origLog;
      }
    }

    // ─── Batch download ───────────────────────────────────────────────────────

    function generateBatch() {
      const count  = Math.max(1, parseInt(document.getElementById('count-val').value, 10) || 10);
      const size   = parseInt(document.getElementById('size-val').value, 10);
      const btn    = document.getElementById('dl-btn');
      const status = document.getElementById('status');

      btn.disabled = true;
      status.className = 'dim';
      status.textContent = 'Generating…';

      const base    = Date.now();
      const tests   = [];
      let   skipped = 0;

      for (let i = 0; i < count; i++) {
        const name = `gen_${base}_${i}`;
        // Retry up to 5 times in case the program produces a runtime error
        let ok = false;
        for (let attempt = 0; attempt < 5; attempt++) {
          try {
            const { prog, input } = generateOne(size);
            const expected = runProg(prog, input);
            tests.push({ name, prog, input, expected });
            ok = true;
            break;
          } catch (_) {}
        }
        if (!ok) skipped++;
      }

      btn.disabled = false;

      if (tests.length === 0) {
        status.className = 'err';
        status.textContent = 'All programs errored — try a different size.';
        return;
      }

      const script = buildBatchScript(tests);
      const blob   = new Blob([script], { type: 'text/x-shellscript' });
      const a      = document.createElement('a');
      a.href       = URL.createObjectURL(blob);
      a.download   = `batch_${base}.sh`;
      a.click();
      URL.revokeObjectURL(a.href);

      status.className = 'ok';
      status.textContent =
        `Downloaded ${tests.length} test${tests.length !== 1 ? 's' : ''}` +
        (skipped ? ` (${skipped} skipped due to runtime errors)` : '') + '.';
    }

    function buildBatchScript(tests) {
      const lines = [];
      lines.push('#!/bin/bash');
      lines.push(`# Auto-generated batch of ${tests.length} Diamondback tests`);
      lines.push('set -e', '');
      lines.push('SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"');
      lines.push('ALL_TESTS="$SCRIPT_DIR/tests/all_tests.rs"', '');

      // Write each snek file via a heredoc
      for (const { name, prog } of tests) {
        const delim = 'SNEK_' + name.replace(/\W/g, '_').toUpperCase();
        lines.push(`cat > "$SCRIPT_DIR/tests/${name}.snek" << '${delim}'`);
        lines.push(prog);
        lines.push(delim, '');
      }
      lines.push(`echo "Wrote ${tests.length} .snek files"`, '');

      // One Python call inserts all entries into all_tests.rs at once
      lines.push("python3 - \"$ALL_TESTS\" << 'PYEOF'");
      lines.push('import sys');
      lines.push('path = sys.argv[1]');
      lines.push('with open(path) as f:');
      lines.push('    content = f.read()');
      lines.push('');

      // Build the combined entries block
      lines.push('entries = (');
      for (const { name, input, expected } of tests) {
        const rustExpected = expected
          .replace(/\\/g, '\\\\')
          .replace(/"/g,  '\\"')
          .replace(/\n/g, '\\n');
        lines.push('    "    {\\n"');
        lines.push(`    "        name: ${name},\\n"`);
        lines.push(`    "        file: \\"${name}.snek\\",\\n"`);
        lines.push(`    "        input: \\"${input}\\",\\n"`);
        lines.push(`    "        expected: \\"${rustExpected}\\",\\n"`);
        lines.push('    "    },\\n"');
      }
      lines.push(')');
      lines.push('');
      lines.push("marker = '}\\n\\nruntime_error_tests'");
      lines.push('idx = content.find(marker)');
      lines.push('if idx == -1:');
      lines.push('    print("Error: could not find insertion point in all_tests.rs", file=sys.stderr)');
      lines.push('    sys.exit(1)');
      lines.push('');
      lines.push("content = content[:idx] + entries + content[idx:]");
      lines.push('with open(path, \'w\') as f:');
      lines.push('    f.write(content)');
      lines.push('');
      lines.push(`print(f"Added ${tests.length} tests to {path}")`);
      lines.push('PYEOF', '');
      lines.push(`echo "Done! Run: cargo test"`);

      return lines.join('\n') + '\n';
    }
  </script>
</body>
</html>
